name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Host jobs (fmt / core tests / workspace check) run on every push and PR; the
# APK cross-compile runs on pushes to main.
#
# The Android setup here is PORTED FROM A WORKFLOW KNOWN TO BUILD THIS STACK
# GREEN, not invented. Several steps look superfluous and are not - each one
# corresponds to a failure that is silent or badly-reported:
#
#   * setup-android needs `packages: ""`; with the default it runs its own
#     package install and fails the job before anything else executes.
#   * ~25 GB of preinstalled toolchains must be deleted or the debug link runs
#     out of disk and clang dies with a bare SIGBUS ("Bus error").
#   * CARGO_BUILD_JOBS caps parallel compiles so Skia's C++ build stays under
#     the 7 GB runner ceiling.
#   * NO swapfile in the APK job. A 10 GB /swapfile eats the very disk the
#     linker needs; the OOM it would guard against is a release-LTO problem.
#   * `cargo clean -p` forces a fresh relink. rust-cache restores all of
#     target/, and a truncated .so from an earlier out-of-disk build is treated
#     as up-to-date and packaged as a broken stub.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test-core:
    name: core tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p slint_android_app_core

  clippy:
    name: clippy (workspace)
    runs-on: ubuntu-latest
    steps:
      # No swapfile / job cap here. The host build uses slint's SOFTWARE
      # renderer (app/Cargo.toml selects backends per target), so it never
      # compiles Skia and stays light - the whole workspace checks in ~20s.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just install-host-deps
      - uses: Swatinem/rust-cache@v2
      # Slint gates the android-activity backend behind target_os = "android",
      # so the app crate DOES lint on the host with no NDK.
      - run: just clippy

  apk:
    name: debug APK
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Debug, not release: a release APK is UNSIGNED without a keystore, and an
    # unsigned APK will not install. Debug auto-signs with the standard Android
    # debug key, so this proves the app really packages into something
    # installable. Signed builds are release.yml's job.
    env:
      ANDROID_API: "34"
      ANDROID_BUILD_TOOLS: "34.0.0"
      ANDROID_NDK_VERSION: "27.0.12077973"
      CARGO_BUILD_JOBS: "2"
      # An unstripped debug Skia lib is ~290MB; stripping keeps it runnable and
      # shrinks it by an order of magnitude.
      CARGO_PROFILE_DEV_STRIP: "symbols"
    steps:
      - name: Free disk space
        run: |
          echo "before:"; df -h / | tail -1
          # /usr/share/dotnet alone is ~25GB; none of these are used here.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          echo "after:"; df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android platform, build-tools, NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-$ANDROID_API" \
            "build-tools;$ANDROID_BUILD_TOOLS" \
            "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: cargo install cargo-apk2 --locked
      # Kotlin compiler. cargo-apk2 only shells out to kotlinc when a crate (or
      # app/kotlin/) actually declares kotlin_sources, so this is inert for a
      # pure-Rust app. It is installed unconditionally so that the day you DO
      # add a Kotlin component, CI keeps working without anyone having to
      # remember to come back and edit this file - the devcontainer already
      # ships kotlinc, and a local-works/CI-fails split is exactly the trap
      # worth spending 10s of runner time to avoid.
      - name: Install Kotlin compiler
        run: |
          curl -sSL https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip -o /tmp/kotlinc.zip
          unzip -q /tmp/kotlinc.zip -d "$HOME"
          echo "KOTLIN_HOME=$HOME/kotlinc" >> "$GITHUB_ENV"
          echo "$HOME/kotlinc/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Force fresh app relink
        run: cargo clean -p slint_android_app
      # `just apk` builds with --lib and then gates the result: arm64 .so must
      # be a real build not a truncated stub, and a launcher activity must
      # exist or the app installs with no icon and cannot be opened.
      - name: Build and verify debug APK
        run: just apk
      - name: Locate APK
        id: find
        run: echo "path=$(just apk-path debug)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          # The verified, installable APK only - never the -unaligned
          # intermediate cargo-apk2 also emits.
          path: ${{ steps.find.outputs.path }}
          if-no-files-found: error
          retention-days: 7
