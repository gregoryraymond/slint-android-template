[package]
name = "slint_android_app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `cdylib` is what cargo-apk2 packages into the APK. `rlib` additionally lets
# host tests and examples link against the crate.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
app_core = { workspace = true }

# Slint is declared PER TARGET, which is why it is not a workspace dependency.
#
# On Android: the android-activity backend + Skia renderer - what cargo-apk2
# actually packages. On the host (desktop dev, `cargo check`, CI lint): winit +
# FemtoVG, so the workspace type-checks with no NDK installed. The same UI code
# builds either way.
[target.'cfg(target_os = "android")'.dependencies.slint]
version = "1"
default-features = false
features = ["compat-1-2", "std", "backend-android-activity-06", "renderer-skia"]

# femtovg on the host: GPU-accelerated, so a desktop preview built from this
# crate is actually usable, not a slideshow. renderer-software builds ~15s
# faster but only ever suits type-checking.
#
# NOT Skia on the host, even though that is what ships on device. Skia is by far
# the heaviest of the three to build and was what forced a swapfile workaround
# into CI. The cost of this choice is that desktop preview and device rendering
# go through different renderers, so treat the device as the source of truth for
# pixel-level work.
[target.'cfg(not(target_os = "android"))'.dependencies.slint]
version = "1"
default-features = false
features = ["compat-1-2", "std", "backend-winit", "renderer-femtovg"]

[build-dependencies]
slint-build = { workspace = true }

# ---- cargo-apk2 packaging ----
# Everything below is read by cargo-apk2 when packaging the cdylib into an APK.
# `build_targets` is what lets `cargo apk2 run` work without an explicit
# --target.
[package.metadata.android]
package = "com.example.slintandroidapp"
# aarch64 is what real devices use; x86_64 is the default emulator image on
# Linux/Windows hosts. With both listed one APK runs on a phone or the emulator.
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "android-res"
assets = "android-assets"

# Uncomment to compile hand-written Kotlin/Java from app/kotlin/ into the APK's
# classes.dex, or to receive .kt that a glue crate emits there from build.rs.
# Left commented because kotlinc errors on an empty source directory, so
# enabling it before there is anything to compile breaks the build. CI already
# installs kotlinc, so uncommenting is the only step needed.
#   kotlin_sources = "kotlin"
# java_sources works the same way for .java.

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "Slint Android App"
# NoActionBar: NativeActivity's default theme carries a never-composited system
# ActionBar that still inflates content_rect.top, which makes the app's
# safe-area inset come out roughly twice the status bar height.
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

# THIS BLOCK IS REQUIRED. cargo-apk2 - unlike the original cargo-apk - does NOT
# generate an activity implicitly. Without it the manifest contains zero
# activities, so the app installs successfully but has no launcher icon and
# cannot be opened at all. `just apk` fails the build on exactly this, because
# it is otherwise completely silent.
#
# Slint's backend-android-activity-06 enables android-activity's
# *native-activity* feature, so the launcher activity is the framework's own
# android.app.NativeActivity - always present on-device, no bundled Java - with
# android.app.lib_name naming our cdylib.
[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
label = "Slint Android App"
# Slint handles these itself; declaring them stops Android destroying and
# recreating the activity (losing the GL surface) on rotate / keyboard show.
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|density"
exported = true

# Must match the cdylib name, i.e. the [package] name above.
[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "slint_android_app"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

# Slint's Skia renderer uses Vulkan when available but falls back to GL.
# Declare Vulkan optional so the APK still installs on Vulkan-less devices.
[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = false
version = 1
